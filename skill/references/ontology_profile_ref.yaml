# ==============================================================================
# ontology_profile_ref.yaml
# 谋圣·售点洞察 (mousheng-outlet-insight) - 上位本体 Profile 引用元数据文件
#
# 权威原则：
# 1. prism-ontology 是上位语义唯一权威；谋圣仅为世界模型之上的独立认识器官（Insight Component）。
# 2. 本文件仅作为 Profile 引用声明，消费已发布的 Operational Profile。
# ==============================================================================

profile_reference:
  profile_uri: "prism://ontology/profiles/outlet-insight"
  # 原 "0.1.0" 为上游已删除的孤儿发行（prism-ontology#13）；现指向实际存在的发行身份（tag: outlet-insight-v0.1.0-rc2）
  ontology_version: "0.1.0-rc2"
  profile_version: "0.1.0-rc2"
  schema_version: "draft-2020-12"
  # outlet-insight.profile.yaml @ dist/outlet-insight/0.1.0-rc2（与 profile.lock locked_checksums 一致）
  checksum: "sha256:035cece0400258ab5571f0c5217cf2c48f4088b25c045caff291bdc30e92f09b"
  status: "release_candidate"
  # 可移植定位符（禁止机器绝对路径）；门禁解析优先级：
  # PRISM_DIST_DIR -> 仓库同级 ../prism-ontology/dist/outlet-insight/<profile_version> -> ~/prism-ontology/dist/outlet-insight/<profile_version>
  distribution_source: "prism-ontology/dist/outlet-insight/0.1.0-rc2"
  distribution_source_env: "PRISM_DIST_DIR"
  compatible_component_versions: ">=1.1.0,<2.0.0"

  required_upstream_modules:
    # 模块 ID 与 dist/outlet-insight/0.1.0-rc2/outlet-insight.profile.yaml included_modules 对齐；
    # rc3 起上游删除 4 个概念 URI 且 rc4 SHACL 将 observedValue 更名 hasResultValue（破坏性），
    # 当前唯一通过下游门禁的发行即锁定版本，故约束精确钉定：
    - module: "prism:core"
      version_constraint: "==0.1.0-rc2"
    - module: "prism:outlet"
      version_constraint: "==0.1.0-rc2"
    - module: "prism:insight"
      version_constraint: "==0.1.0-rc2"
    - module: "prism:sales-visit-boundary"
      version_constraint: "==0.1.0-rc2"

  governance:
    authority: "prism-ontology"
    maintainer: "TopPrism Ontology Engineering Team"
    target_component: "mousheng-outlet-insight"
